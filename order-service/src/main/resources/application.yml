spring:
  application:
    name: order-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/orders}
    username: ${DB_USERNAME:orders}
    password: ${DB_PASSWORD:orders}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC

server:
  port: ${SERVER_PORT:8080}

# Spring Cloud AWS. For LocalStack the endpoint + static credentials are supplied via env.
# In real AWS, leave endpoint unset and rely on the ECS task role for credentials.
spring.cloud.aws:
  region:
    static: ${AWS_REGION:us-east-1}
  credentials:
    access-key: ${AWS_ACCESS_KEY_ID:test}
    secret-key: ${AWS_SECRET_ACCESS_KEY:test}
  endpoint: ${AWS_ENDPOINT:}
  sqs:
    listener:
      max-concurrent-messages: 10

app:
  aws:
    sns:
      order-events-arn: ${ORDER_EVENTS_TOPIC_ARN:arn:aws:sns:us-east-1:000000000000:order-events}
    sqs:
      order-status-queue: ${ORDER_STATUS_QUEUE:order-status-queue}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: order-service

logging:
  level:
    com.example.eps: INFO
    io.awspring.cloud: WARN

---
# Local profile: run with no external AWS/Postgres using H2 + LocalStack endpoint.
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:orders;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
