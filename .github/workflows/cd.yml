name: CD (Deploy to AWS)

# Deploys on a tag push or manual dispatch. Requires the following repo configuration:
#   - Variables: AWS_REGION, AWS_ACCOUNT_ID, ECS_CLUSTER, PROJECT (default "eps")
#   - OIDC role: secrets.AWS_DEPLOY_ROLE_ARN (recommended) OR access keys.
on:
  workflow_dispatch:
  push:
    tags: [ 'v*' ]

permissions:
  id-token: write   # for OIDC federation with AWS
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  PROJECT: ${{ vars.PROJECT || 'eps' }}
  ENVIRONMENT: dev

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build artifacts
        run: mvn -B -DskipTests package

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag & push images
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          for svc in order-service payment-service; do
            docker build -f $svc/Dockerfile \
              -t $REGISTRY/$PROJECT/$svc:$IMAGE_TAG \
              -t $REGISTRY/$PROJECT/$svc:latest .
            docker push $REGISTRY/$PROJECT/$svc:$IMAGE_TAG
            docker push $REGISTRY/$PROJECT/$svc:latest
          done

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform apply (infra + new images + lambda)
        working-directory: infra/terraform
        env:
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          terraform init -input=false
          terraform apply -auto-approve -input=false \
            -var="aws_region=${AWS_REGION}" \
            -var="order_service_image=${REGISTRY}/${PROJECT}/order-service:${IMAGE_TAG}" \
            -var="payment_service_image=${REGISTRY}/${PROJECT}/payment-service:${IMAGE_TAG}"

      - name: Force ECS to pull new images
        run: |
          CLUSTER="${PROJECT}-${ENVIRONMENT}-cluster"
          aws ecs update-service --cluster "$CLUSTER" --service "${PROJECT}-${ENVIRONMENT}-order-service" --force-new-deployment
          aws ecs update-service --cluster "$CLUSTER" --service "${PROJECT}-${ENVIRONMENT}-payment-service" --force-new-deployment
