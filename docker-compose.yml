# Local end-to-end stack: LocalStack (SNS/SQS/DynamoDB/Lambda) + Postgres + both services.
# Usage:
#   mvn -DskipTests package          # build jars (incl. notification-lambda shaded jar)
#   docker compose up --build
# Then: curl -X POST localhost:8080/api/v1/orders -H 'content-type: application/json' \
#         -d '{"customerId":"c1","amount":42.50,"currency":"USD"}'
services:
  localstack:
    image: localstack/localstack:3.8
    ports:
      - "4566:4566"
    environment:
      - SERVICES=sns,sqs,dynamodb,lambda,iam,cloudwatch,logs
      - DEFAULT_REGION=us-east-1
      - LAMBDA_RUNTIME_ENVIRONMENT_TIMEOUT=120
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - "./localstack/init:/etc/localstack/init/ready.d"
      - "./notification-lambda/target/notification-lambda.jar:/opt/code/lambda/notification-lambda.jar:ro"
      - "/var/run/docker.sock:/var/run/docker.sock"
    # Gate on a resource the bootstrap script creates late, so dependent services don't
    # start polling SQS before the queues/topics/subscriptions exist.
    healthcheck:
      test: ["CMD-SHELL", "awslocal dynamodb describe-table --table-name payments >/dev/null 2>&1"]
      interval: 8s
      timeout: 5s
      retries: 30

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=orders
      - POSTGRES_USER=orders
      - POSTGRES_PASSWORD=orders
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders"]
      interval: 5s
      timeout: 3s
      retries: 10

  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - DB_URL=jdbc:postgresql://postgres:5432/orders
      - DB_USERNAME=orders
      - DB_PASSWORD=orders
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_ENDPOINT=http://localstack:4566
      - ORDER_EVENTS_TOPIC_ARN=arn:aws:sns:us-east-1:000000000000:order-events
      - ORDER_STATUS_QUEUE=order-status-queue
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy

  payment-service:
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    ports:
      - "8081:8081"
    environment:
      - SERVER_PORT=8081
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_ENDPOINT=http://localstack:4566
      - PAYMENT_EVENTS_TOPIC_ARN=arn:aws:sns:us-east-1:000000000000:payment-events
      - PAYMENT_QUEUE=payment-queue
      - PAYMENTS_TABLE=payments
      - PAYMENT_AUTO_APPROVE_LIMIT=1000
    depends_on:
      localstack:
        condition: service_healthy
